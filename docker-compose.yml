################################################################################
# ARCHIVO: docker-compose.yml
# PROPÓSITO: Orquestación de todos los servicios con Docker Compose
#
# Docker Compose permite definir y ejecutar múltiples contenedores Docker
# como si fuera un solo sistema. Este archivo define 4 servicios:
#
# 1. db (PostgreSQL)      → Base de datos relacional
# 2. redis               → Cache y pub/sub para WebSocket
# 3. api (FastAPI)       → Backend de la aplicación
# 4. web (Next.js)       → Frontend
#
# CÓMO USAR:
#   1. Copiar variables de entorno:    cp .env.example .env
#   2. Construir y arrancar servicios: docker compose up --build
#   3. Parar servicios:                docker compose down
#   4. Ver logs:                       docker compose logs -f api
#
# NOTAS:
# - Los servicios están en la misma red Docker (se ven entre sí)
# - Las variables ${VAR:-default} usan valor de .env o default si no existe
# - Los healthchecks verifican que los servicios estén listos antes de iniciar
#   los dependientes
#
################################################################################

services:
  # ========== SERVICIO: PostgreSQL 16 ==========
  # Base de datos relacional. Almacena usuarios, tickets, comentarios, etc.
  # Alpine es una versión tiny de Linux (~50MB vs 300MB)
  db:
    image: postgres:16-alpine
    env_file:
      # POSTGRES_USER/PASSWORD/DB vienen de api/.env (misma fuente que el
      # backend, para no duplicar credenciales). Postgres los lee al inicializarse.
      - ./api/.env
    volumes:
      # Volumen persistente: los datos sobreviven si se para el contenedor
      # Sin esto, cada "docker compose up" estaría con BD vacía
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Verificación de salud: ¿está PostgreSQL listo para conexiones?
      # Se ejecuta cada 5s, timeout 5s, reintentos 10
      # Si falla 10 veces = servicio considerado unhealthy
      # El api NO arrancará hasta que db sea healthy.
      # ${POSTGRES_*:-deskly} se interpola en build-time del YAML; usamos el
      # mismo default (deskly) que en api/.env para que coincida.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deskly} -d ${POSTGRES_DB:-deskly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ========== SERVICIO: Redis 7 ==========
  # Cache en memoria + pub/sub para eventos WebSocket en tiempo real
  # Permite que múltiples instancias del API compartan eventos de tickets
  redis:
    image: redis:7-alpine
    healthcheck:
      # Verificar que Redis responde a PING
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ========== SERVICIO: FastAPI Backend ==========
  # API REST que maneja tickets, usuarios, autenticación, webhooks, WebSocket
  # Se construye desde ./api/Dockerfile (imagen personalizada)
  api:
    build: ./api
    depends_on:
      # El API solo arranca cuando db y redis estén healthy
      # "condition: service_healthy" espera a que los healthchecks pasen
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      # Única fuente de verdad de las variables del backend: api/.env.
      # Incluye DATABASE_URL y REDIS_URL, que usan el NOMBRE del servicio Docker
      # ("db"/"redis") como host, porque el backend corre dentro de la red
      # Docker. Sin bloque "environment" duplicado: cero repetición de variables.
      - ./api/.env
    ports:
      # Exponer puerto 8000 del contenedor en el host
      # Acceso: http://localhost:8000 (desde fuera del Docker)
      # Docs: http://localhost:8000/docs
      - "8000:8000"

  # ========== SERVICIO: Next.js Frontend ==========
  # Interfaz web: listado de tickets, login, etc.
  # Se construye desde ./web/Dockerfile (con multi-stage: deps → builder → runtime)
  web:
    build:
      context: ./web
      args:
        # NEXT_PUBLIC_*: se "hornean" (bake) en el bundle de JavaScript en
        # BUILD-TIME (no en runtime), por eso van aquí como build args y NO en
        # env_file. El navegador las usa para conectar al API y al WebSocket.
        #
        # En dev/entrega apuntan a localhost (el navegador del host accede por
        # los puertos publicados). Para staging/producción se sobrescriben al
        # construir la imagen:
        #   docker compose build --build-arg NEXT_PUBLIC_API_URL=https://api.midominio.com web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/tickets}
    depends_on:
      # El web arranca después del api (aunque sea automático)
      - api
    env_file:
      # Variables de RUNTIME del frontend (las lee el servidor Next en SSR).
      # Contiene API_INTERNAL_URL=http://api:8000 (el SSR llama al backend por
      # el nombre del servicio dentro de la red Docker, no por localhost).
      # Fuente de verdad separada del backend, sin duplicación.
      - ./web/.env
    ports:
      # Puerto 3000: acceso http://localhost:3000
      - "3000:3000"

volumes:
  db_data:
